# Compila y firma el APK de Respaldo WiFi.
# Se ejecuta solo cada vez que subes cambios a "main", o a mano desde la pestaña Actions
# ("Compilar APK" -> "Run workflow"). El APK queda en "Artifacts" al final de la ejecución.
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v5

      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Probar el motor de subida contra el servidor PHP
        run: bash pruebas/anotar.sh "Prueba del motor" bash pruebas/motor/correr.sh

      - name: Copiar la interfaz web a Android (Capacitor)
        run: |
          npm ci
          npx cap sync android

      - name: Preparar la llave de firma
        env:
          FIRMA_BASE64: ${{ secrets.FIRMA_BASE64 }}
        run: |
          if [ -n "$FIRMA_BASE64" ]; then
            echo "$FIRMA_BASE64" | base64 -d > "$RUNNER_TEMP/respaldo-wifi.jks"
            echo "FIRMA_ARCHIVO=$RUNNER_TEMP/respaldo-wifi.jks" >> "$GITHUB_ENV"
            echo "Se firmará con TU llave."
          else
            echo "::warning::No configuraste los Secrets FIRMA_BASE64 y FIRMA_CLAVE. El APK se firma con una llave de prueba: sirve para probar, pero luego no podrás actualizarlo encima. Lee GUIA.md, paso 3."
          fi

      - name: Compilar
        env:
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
        working-directory: android
        run: |
          chmod +x gradlew
          bash ../pruebas/anotar.sh "Compilación" ./gradlew --no-daemon --console=plain assembleRelease assembleDebug

      - name: Ponerle nombre al APK
        run: |
          mkdir -p salida
          cp android/app/build/outputs/apk/release/app-release.apk "salida/RespaldoWiFi-$VERSION_NAME.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "salida/app-debug.apk"
          ls -la salida
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "salida/RespaldoWiFi-$VERSION_NAME.apk" | head -5 || true

      - name: Guardar el APK (descárgalo en "Artifacts")
        uses: actions/upload-artifact@v4
        with:
          name: RespaldoWiFi-${{ env.VERSION_NAME }}
          path: salida/RespaldoWiFi-*.apk
          retention-days: 90

      - name: Guardar el APK de prueba (para la prueba en emulador)
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: salida/app-debug.apk
          retention-days: 7

  emulador:
    name: Prueba en emulador (pantalla apagada)
    needs: compilar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Descargar el APK de prueba
        uses: actions/download-artifact@v4
        with:
          name: apk-debug

      - name: Activar aceleración (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Arrancar emulador Android 14 y probar
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash pruebas/anotar.sh "Prueba en emulador" bash pruebas/emulador/prueba.sh app-debug.apk

      - name: Publicar evidencias en la rama "evidencias"
        if: always()
        run: |
          [ -d evidencias ] || exit 0
          cd evidencias
          git init -q -b evidencias
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "Evidencias de la ejecución ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" evidencias

      - name: Guardar evidencias (registro y capturas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-prueba
          path: evidencias/
          retention-days: 14
